blueprint:
  name: Rollo Steuerung mit Türsensor, Sonnenuntergang & Offset
  description: >
    Schließt das Rollo vor Sonnenuntergang (mit Offset), wenn die Tür geschlossen ist.
    Öffnet das Rollo auf 5 %, wenn die Tür geöffnet wird.
    Verhindert vollständiges Öffnen vor einer definierten Uhrzeit.
  domain: automation

  input:
    rollo:
      name: Rollo
      selector:
        entity:
          domain: cover

    tuer_sensor:
      name: Türsensor
      selector:
        entity:
          domain: binary_sensor

    sunset_entity:
      name: Sonnenuntergang Entität
      description: Entität, die den Sonnenuntergang signalisiert (z. B. sun.sun oder ein Helper)
      selector:
        entity: {}

    sunset_offset:
      name: Minuten vor Sonnenuntergang
      description: Negativer Wert = vor Sonnenuntergang, 0 = exakt, positiv = nach Sonnenuntergang
      default: -20
      selector:
        number:
          min: -120
          max: 120
          step: 1
          unit_of_measurement: "min"

    min_open_time:
      name: Früheste vollständige Öffnungszeit
      default: "09:00:00"
      selector:
        time: {}

    open_position:
      name: Öffnungsposition bei Türöffnung
      default: 5
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

mode: single

trigger:
  - id: sunset
    platform: template
    value_template: >
      {{ now() >= (states[inputs.sunset_entity].attributes.next_setting | as_datetime - timedelta(minutes=inputs.sunset_offset | int)) }}

  - id: tuer_auf
    platform: state
    entity_id: !input tuer_sensor
    from: "off"
    to: "on"

condition: []

action:
  - choose:
      # --- Sonnenuntergang mit Offset ---
      - conditions:
          - condition: trigger
            id: sunset
          - condition: state
            entity_id: !input tuer_sensor
            state: "off"
        sequence:
          - service: cover.close_cover
            target:
              entity_id: !input rollo

      # --- Tür wird geöffnet ---
      - conditions:
          - condition: trigger
            id: tuer_auf
        sequence:
          - condition: time
            after: !input min_open_time
          - service: cover.set_cover_position
            target:
              entity_id: !input rollo
            data:
              position: !input open_position
