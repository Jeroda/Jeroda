blueprint:
  name: Rollo Steuerung mit Türsensor & Zeitlogik
  description: >
    Schließt das Rollo bei Sonnenuntergang (konfigurierbare Entität), wenn die Tür geschlossen ist.
    Öffnet das Rollo auf 5 %, wenn die Tür geöffnet wird.
    Verhindert vollständiges Öffnen vor einer definierten Uhrzeit.
  domain: automation

  input:
    rollo:
      name: Rollo
      selector:
        entity:
          domain: cover

    tuer_sensor:
      name: Türsensor
      selector:
        entity:
          domain: binary_sensor

    sunset_entity:
      name: Sonnenuntergang Entität
      description: Entität, die den Sonnenuntergang signalisiert (z. B. sun.sun oder ein Helper)
      selector:
        entity: {}

    min_open_time:
      name: Früheste vollständige Öffnungszeit
      default: "09:00:00"
      selector:
        time: {}

    open_position:
      name: Öffnungsposition bei Türöffnung
      default: 5
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

mode: single

trigger:
  - id: sunset
    platform: state
    entity_id: !input sunset_entity

  - id: tuer_auf
    platform: state
    entity_id: !input tuer_sensor
    from: "off"
    to: "on"

condition: []

action:
  - choose:
      # --- Sonnenuntergang ---
      - conditions:
          - condition: trigger
            id: sunset
          - condition: state
            entity_id: !input tuer_sensor
            state: "off"
        sequence:
          - service: cover.close_cover
            target:
              entity_id: !input rollo

      # --- Tür wird geöffnet ---
      - conditions:
          - condition: trigger
            id: tuer_auf
        sequence:
          - condition: time
            after: !input min_open_time
          - service: cover.set_cover_position
            target:
              entity_id: !input rollo
            data:
              position: !input open_position
